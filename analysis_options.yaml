# This file configures the analyzer for the Kamasutra app.
#
# Base set: `flutter_lints`. On top we enable only rules that catch *real bugs*
# and are very unlikely to fire on the existing codebase, so dropping this in
# does NOT produce a wall of new warnings. The noisier-but-useful rules
# (unawaited_futures, use_build_context_synchronously, avoid_void_async,
# always_declare_return_types) and severity promotions are intentionally left
# OFF — enable them per-folder during a dedicated cleanup once the code is
# already conforming, not in one sweep over a 28k-line codebase.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Real bugs that are rare in practice (so near-zero new warnings):
    avoid_empty_else: true
    avoid_returning_null_for_future: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    no_adjacent_strings_in_list: true
    no_duplicate_case_values: true
    throw_in_finally: true

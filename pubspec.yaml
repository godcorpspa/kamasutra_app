name: kamasutra_app
description: Kamasutra & Couple Games - An intimate app for couples.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.1

  # Firebase (opzionale - per login e sync cloud)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.1.6
  # Storage locale
  shared_preferences: ^2.2.2

  # Localization
  easy_localization: ^3.0.3
  intl: ^0.20.2

  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  confetti: ^0.7.0

  # Utilities
  http: ^1.6.0
  uuid: ^4.2.1
  equatable: ^2.0.5
  collection: ^1.18.0
  crypto: ^3.0.3

  # Security
  local_auth: ^2.1.7

  # URL launching (email, links)
  url_launcher: ^6.2.2

  # Audio playback
  audioplayers: ^6.1.0

  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/positions/
    - assets/audio/
    - assets/lang/
    - assets/positions/
    - assets/fonts/OFL-PlayfairDisplay.txt
    - assets/fonts/OFL-DMSans.txt

  # Fonts are licensed under the SIL OFL 1.1 (see assets/fonts/OFL-*.txt,
  # registered with LicenseRegistry in main.dart).
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
    # DM Sans 18pt is the optical size cut designed for UI/body text.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
        - asset: assets/fonts/DMSans_18pt-Italic.ttf
          style: italic
        - asset: assets/fonts/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_18pt-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
